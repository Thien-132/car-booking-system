<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Trang chủ thuê xe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{ background:#f5f5f5; }

        .car-card{ transition:0.3s; }
        .car-card:hover{ transform:scale(1.05); }

        .price{
            color:red;
            font-size:18px;
            font-weight:bold;
        }

        .search-box{
            background:white;
            border-radius:20px;
            padding:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
            margin-top:-60px;
            position:relative;
            z-index:10;
        }

        .promo{
            height:220px;
            object-fit:cover;
            border-radius:15px;
        }

        .location-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
        }

        .location-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            color: white;
            font-weight: bold;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        }

        .feature-box {
            padding: 25px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .feature-box:hover{
            transform:translateY(-5px);
        }
    </style>
</head>

<body>

<div th:replace="header :: header"></div>

<!-- SEARCH -->
<div class="container">
    <form action="/available-cars" method="get" class="search-box">
        <div class="row align-items-center">

            <div class="col-md-3">
                <label>📍 Địa điểm</label>
                <select name="location" class="form-control">
                    <option value="HCM">TP.HCM</option>
                    <option value="HN">Hà Nội</option>
                </select>
            </div>

            <div class="col-md-3">
                <label>🕐 Ngày nhận</label>
                <input type="datetime-local" name="startDate" class="form-control">
            </div>

            <div class="col-md-3">
                <label>🕐 Ngày trả</label>
                <input type="datetime-local" name="endDate" class="form-control">
            </div>

            <div class="col-md-3 mt-4">
                <button class="btn btn-success w-100">🔍 Tìm xe</button>
            </div>

        </div>
    </form>
</div>

<div class="container mt-5">

    <!-- PROMOTION -->
    <h2 class="text-center fw-bold">🎁 Chương Trình Khuyến Mãi</h2>

    <div class="row mt-4">

        <div class="col-md-4">
            <img src="/images/km1.jpg" class="promo w-100">
        </div>

        <div class="col-md-4">
            <img src="/images/km2.jpg" class="promo w-100">
        </div>

        <div class="col-md-4">
            <img src="/images/km3.jpg" class="promo w-100">
        </div>

    </div>
</div>

<!-- CAR LIST -->
<h2 class="mt-5 mb-4">🚗 Danh sách xe</h2>

<div class="row">
    <div class="col-md-4 mb-4" th:each="car : ${cars}">
        <div class="card shadow car-card">

            <img th:src="${car.image != null ? car.image : 'https://via.placeholder.com/400x220'}"
                 class="card-img-top" style="height:220px;object-fit:cover">

            <div class="card-body">
                <h5 th:text="${car.name}"></h5>
                <p class="price" th:text="${car.price} + ' VND/ngày'"></p>
            </div>

        </div>
    </div>
</div>

<!-- LOCATION -->
<h2 class="text-center mt-5">📍 Địa Điểm Nổi Bật</h2>

<div class="row mt-4">

    <div class="col-md-3">
        <div class="location-card">
            <img src="https://images.unsplash.com/photo-1583417319070-4a69db38a482?w=800">
            <div class="overlay">TP.HCM</div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="location-card">
            <img src="https://images.unsplash.com/photo-1558980664-10ea292b0b92?w=800">
            <div class="overlay">Hà Nội</div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="location-card">
            <img src="https://images.unsplash.com/photo-1565967511849-76a60a516170?w=800">
            <div class="overlay">Đà Nẵng</div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="location-card">
            <img src="https://images.unsplash.com/photo-1605276374104-dee2a0ed3cd6?w=800">
            <div class="overlay">Bình Dương</div>
        </div>
    </div>

</div>

<!-- FEATURES -->
<h2 class="text-center mt-5">⭐ Ưu Điểm</h2>

<div class="row text-center mt-4">

    <div class="col-md-4">
        <div class="feature-box">
            <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" width="60">
            <h5 class="mt-3">Lái xe an toàn</h5>
            <p>Bảo hiểm đầy đủ</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="feature-box">
            <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" width="60">
            <h5 class="mt-3">An tâm đặt xe</h5>
            <p>Hoàn tiền nhanh</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="feature-box">
            <img src="https://cdn-icons-png.flaticon.com/512/1828/1828817.png" width="60">
            <h5 class="mt-3">Thủ tục đơn giản</h5>
            <p>Chỉ cần CCCD</p>
        </div>
    </div>

</div>

</div>

<!-- LOGIN MODAL -->
<div class="modal fade" id="loginModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">

            <h4 class="text-center">🔐 Đăng nhập</h4>

            <form action="/login" method="post">
                <input type="email" name="email" class="form-control mb-2" placeholder="Email">
                <input type="password" name="password" class="form-control mb-3" placeholder="Password">

                <button class="btn btn-success w-100">Đăng nhập</button>
            </form>

        </div>
    </div>
</div>

<!-- REGISTER MODAL -->
<div class="modal fade" id="registerModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">

            <h4 class="text-center">📝 Đăng ký</h4>

            <form action="/register" method="post">
                <input name="name" class="form-control mb-2" placeholder="Tên">
                <input name="email" class="form-control mb-2" placeholder="Email">
                <input name="phone" class="form-control mb-2" placeholder="SĐT">
                <input type="password" name="password" class="form-control mb-2" placeholder="Mật khẩu">
                <input type="password" name="confirmPassword" class="form-control mb-3" placeholder="Nhập lại">

                <button class="btn btn-success w-100">Đăng ký</button>
            </form>

        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center p-4 mt-5">
    © 2026 Thuê Xe
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
