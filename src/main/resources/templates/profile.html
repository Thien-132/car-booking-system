<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ cá nhân</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        .profile-container{
            margin-top:40px;
        }

        .sidebar{
            background:white;
            border-radius:15px;
            padding:20px;
        }

        .sidebar a{
            display:block;
            padding:10px;
            border-radius:10px;
            text-decoration:none;
            color:#333;
            margin-bottom:5px;
        }

        .sidebar a:hover{
            background:#e9f7ef;
            color:#28a745;
        }

        .sidebar .active{
            background:#e9f7ef;
            color:#28a745;
            font-weight:bold;
        }

        .profile-card{
            background:white;
            border-radius:15px;
            padding:25px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .avatar{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
        }

        .info-item{
            display:flex;
            justify-content:space-between;
            margin-bottom:10px;
        }

        .badge-ok{
            background:#28a745;
            color:white;
            padding:3px 10px;
            border-radius:10px;
            font-size:12px;
        }
    </style>
</head>

<body>

<div th:replace="header :: header"></div>

<div class="container profile-container">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3">
            <div class="sidebar">
                <h5>👋 Xin chào!</h5>

                <a class="active">👤 Tài khoản của tôi</a>
                <a href="#">🚗 Quản lý cho thuê</a>
                <a href="#">❤️ Xe yêu thích</a>
                <a href="#">📦 Chuyến của tôi</a>
                <a href="#">🎁 Quà tặng</a>
                <a href="#">📍 Địa chỉ</a>
                <hr>
                <a href="/logout" style="color:red;">🚪 Đăng xuất</a>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="col-md-9">

            <!-- THÔNG TIN -->
            <div class="profile-card mb-4">

                <h5>Thông tin tài khoản</h5>

                <div class="row mt-3">

                    <!-- AVATAR -->
                    <div class="col-md-4 text-center">
                        <img src="https://via.placeholder.com/150" class="avatar mb-3">

                        <h5 th:text="${session.user.name}">Tên</h5>
                        <p>Tham gia: 2024</p>
                    </div>

                    <!-- INFO -->
                    <div class="col-md-8">

                        <div class="info-item">
                            <span>Email</span>
                            <span>
                                <span th:text="${session.user.email}"></span>
                                <span class="badge-ok">Đã xác thực</span>
                            </span>
                        </div>

                        <div class="info-item">
                            <span>Số điện thoại</span>
                            <span th:text="${session.user.phone}"></span>
                        </div>

                        <div class="info-item">
                            <span>Vai trò</span>
                            <span th:text="${session.user.role}"></span>
                        </div>

                    </div>

                </div>
            </div>

            <!-- GPLX -->
            <div class="profile-card">

                <h5>Giấy phép lái xe</h5>

                <p class="text-muted">
                    Vui lòng cập nhật GPLX để thuê xe nhanh hơn
                </p>

                <button class="btn btn-outline-primary">
                    Cập nhật
                </button>

            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
